<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-new-cv</title>
    <script>
        // SPA fallback for GitHub Pages
        // Store the original path in sessionStorage before React loads
        (function () {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            // Store the full path (without trailing slash for consistency)
            var cleanPath = path === '/' ? '/' : path.replace(/\/$/, '');
            if (search) cleanPath += search;
            if (hash) cleanPath += hash;

            // Store in sessionStorage for React to read
            sessionStorage.setItem('spa_fallback_path', cleanPath);

            // Redirect to root - React will handle the routing
            // Use replace() to avoid adding to browser history
            window.location.replace('/');
        })();
    </script>
</head>

<body>
    <p>Loading...</p>
</body>

</html>
