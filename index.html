<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>my-new-cv</title>
  <style>
    /* Instant loading screen - no flash */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loading-screen p {
      color: white;
      margin-top: 16px;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
  <script>
    // Check if we need to restore a path (SPA fallback)
    (function () {
      var path = sessionStorage.getItem('spa_fallback_path');
      if (path) {
        // Store for React to read
        window.SPA_FALLBACK_PATH = path;
      }
    })();
  </script>
</head>

<body>
  <!-- Instant loading screen -->
  <div id="loading-screen">
    <div class="loader"></div>
    <p>Loading...</p>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Hide loading screen after React has fully loaded
    window.addEventListener('load', function () {
      // Small delay to ensure React has rendered
      setTimeout(function () {
        var loading = document.getElementById('loading-screen');
        if (loading) {
          loading.classList.add('hidden');
          // Remove from DOM after transition
          setTimeout(function () {
            loading.remove();
          }, 300);
        }
      }, 100);
    });
  </script>
</body>

</html>
