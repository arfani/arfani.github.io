<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-new-cv</title>
    <script>
        // SPA fallback for GitHub Pages
        // Store the original path in sessionStorage before React loads
        (function () {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            // Store the full path
            var fullPath = path;
            if (search) fullPath += search;
            if (hash) fullPath += hash;

            // Store in sessionStorage for React to read
            sessionStorage.setItem('spa_fallback_path', fullPath);

            // Now redirect to index.html
            if (path === '/' || path === '/index.html') {
                window.location.reload();
            } else {
                window.location.href = '/' + (path === '/' ? '' : path.replace('/', '')) + (search || '') + (hash || '');
            }
        })();
    </script>
</head>

<body>
    <p>Loading...</p>
</body>

</html>
