<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my-new-cv</title>
    <script>
        // SPA fallback for GitHub Pages
        // Store the original path in sessionStorage before React loads
        (function () {
            var path = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;

            // Store the full path including /my-new-cv prefix
            // React Router basename will handle the prefix correctly
            var fullPath = path;
            if (search) fullPath += search;
            if (hash) fullPath += hash;

            // Store in sessionStorage for React to read
            sessionStorage.setItem('spa_fallback_path', fullPath);

            // Now redirect to index.html
            window.location.href = '/my-new-cv/' + (path === '/my-new-cv/' ? '' : path.replace('/my-new-cv', '')) + (search || '') + (hash || '');
        })();
    </script>
</head>

<body>
    <p>Loading...</p>
</body>

</html>
